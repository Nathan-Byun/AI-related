name: 새 콘텐츠 갱신

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 채널 ID 채우기
        run: python scripts/update.py ids
      - name: 유튜브 새 영상 모으기
        run: python scripts/update.py uploads
      - name: 웹사이트 새 글 모으기
        run: python scripts/update.py sites
      - name: 한국어 요약 (키가 있을 때만)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "키가 없어 건너뜁니다."; exit 0; fi
          python scripts/summarize.py
      - name: 변경분 커밋
        run: |
          git config user.name "archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "새 콘텐츠 갱신 $(date -u +%Y-%m-%d)"
          git push
