name: 링크 점검

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 주소 점검
        run: python scripts/update.py check
      - name: 변경분 커밋
        run: |
          git config user.name "archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "링크 점검 $(date -u +%Y-%m-%d)"
          git push
